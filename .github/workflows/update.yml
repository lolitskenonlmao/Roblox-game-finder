name: Update games
on:
  schedule:
    - cron: "*/10 * * * *"
    - cron: "0 */3 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: update-games
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests
      - run: python fetch.py
        env:
          FAST: ${{ github.event.schedule == '*/10 * * * *' && '1' || '0' }}
      - run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git checkout --orphan data-tmp
          git add -A
          git commit -m "update"
          git push -f origin HEAD:main
